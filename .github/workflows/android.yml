name: Montar apps Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'apps/detector/www/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar o Detector (.apk)
        run: gradle -p android/detector assembleRelease --no-daemon

      - name: Guardar o .apk
        run: |
          mkdir -p saida
          cp android/detector/app/build/outputs/apk/release/app-release.apk saida/Detector.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Detector-android
          path: saida/Detector.apk

      - name: Publicar o .apk (ramo "apk" e página de downloads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch --depth 1 origin apk || true
          git worktree add --force /tmp/apk || git worktree add --force --orphan -b apk /tmp/apk
          cd /tmp/apk
          (git checkout apk 2>/dev/null || true)
          cp "$GITHUB_WORKSPACE/saida/Detector.apk" Detector.apk
          git add Detector.apk
          git commit -m "Detector.apk" || true
          git push origin HEAD:apk --force
          cd "$GITHUB_WORKSPACE"
          gh release view android -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create android -R "$GITHUB_REPOSITORY" --title "Apps Android" --notes "Instale no celular Android baixando o arquivo .apk abaixo."
          gh release upload android saida/Detector.apk -R "$GITHUB_REPOSITORY" --clobber
