<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sensor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,system-ui,sans-serif;color:#222}
#tela{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.seg{display:flex;background:#eee;border-radius:12px;padding:3px;width:100%;max-width:340px}
.seg div{flex:1;text-align:center;padding:11px 0;font-size:15px;font-weight:600;border-radius:9px;color:#666}
.seg div.on{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.dica{margin-top:14px;font-size:14px;color:#888;text-align:center;line-height:1.35;min-height:40px}
#bola{margin:auto 0;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(220,225,235,.35) 45%,rgba(180,190,205,.25));
  border:2px solid rgba(150,160,180,.45);box-shadow:inset 0 -10px 30px rgba(0,0,0,.06);transition:background .12s,box-shadow .12s,border-color .12s}
#bola.on{background:radial-gradient(circle at 35% 30%,#c8ffcf,#2ecc40 55%,#1c9a2c);border-color:#1c9a2c;box-shadow:0 0 60px rgba(46,204,64,.7)}
#cont{font-size:15px;color:#555;margin-bottom:14px}
#cont b{font-size:22px;color:#111}
#cam{width:100%;max-width:340px;display:none}
.lb{display:flex;justify-content:space-between;font-size:13px;color:#777;margin:10px 0 6px}
.barra{position:relative;height:14px;background:#eee;border-radius:7px;overflow:hidden}
#luz{position:absolute;left:0;top:0;bottom:0;width:0;background:#f5b800;transition:width .05s}
#lim{position:absolute;top:-2px;bottom:-2px;width:3px;background:#e53935}
input[type=range]{width:100%;margin:4px 0}
.bt{margin-top:12px;display:flex;gap:10px}
.bt div{flex:1;text-align:center;padding:11px 0;border-radius:11px;background:#eee;font-size:15px;font-weight:600;color:#333}
#zerar{width:100%;max-width:340px}
</style></head>
<body>
<div id="tela">
  <div class="seg"><div id="m-prox" class="on">Sensor</div><div id="m-camera">Câmera</div><div id="m-mov">Movimento</div></div>
  <div class="dica" id="dica"></div>
  <div id="bola"></div>
  <div id="cont">Detecções: <b id="n">0</b></div>
  <div id="cam">
    <div class="lb"><span id="tit">Luz que a câmera vê</span><span id="pct">–</span></div>
    <div class="barra"><div id="luz"></div><div id="lim"></div></div>
    <div class="lb"><span>Sensibilidade</span><span id="vs">50</span></div>
    <input type="range" id="sens" min="0" max="100" value="50">
  </div>
  <div class="bt" id="zerar"><div id="recal" style="display:none">Recalibrar luz</div><div id="zero">Zerar contador</div></div>
</div>
<script>
const NATIVO = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sensor);
function mandar(o){ if(NATIVO) window.webkit.messageHandlers.sensor.postMessage(o); }
try{ window.webkit.messageHandlers.barra.postMessage(true); }catch(e){}

const $ = id => document.getElementById(id);
let modo = 'prox', n = 0, coberto = 0, tVerde = null;
const DICAS = {
  prox: 'Passe a mão bem perto do topo do celular (perto da câmera da frente). A tela apaga e vibra. Ao tirar a mão, a bolinha fica verde.',
  mov: 'Passe a mão rápido por cima, de longe (30 a 50 cm). Só conta passada rápida: se algo fica parado na frente (seu rosto), é ignorado.',
  camera: 'Passe a mão por cima da câmera da frente, de mais longe. A bolinha fica verde enquanto a mão faz sombra.'
};

function verde(on){ $('bola').classList.toggle('on', on); }
function contar(){ n++; $('n').textContent = n; }

function escolher(m){
  modo = m; coberto = 0; verde(false);
  $('m-prox').classList.toggle('on', m === 'prox');
  $('m-camera').classList.toggle('on', m === 'camera');
  $('m-mov').classList.toggle('on', m === 'mov');
  const cam = m !== 'prox';
  $('cam').style.display = cam ? 'block' : 'none';
  $('recal').style.display = cam ? 'block' : 'none';
  $('tit').textContent = m === 'mov' ? 'Movimento que a câmera vê' : 'Luz que a câmera vê';
  $('recal').textContent = m === 'mov' ? 'Recalibrar' : 'Recalibrar luz';
  $('pct').textContent = '–';
  $('dica').textContent = DICAS[m] + (NATIVO ? '' : ' (Abra pelo app instalado para funcionar.)');
  mandar({cmd:'modo', modo:m});
  if(cam) mandar({cmd:'sens', valor:+$('sens').value});
}

window.sensorSinal = function(c, nivel, lim){
  if(modo === 'prox'){
    if(c && !coberto){ contar(); verde(false); }
    if(!c && coberto){ verde(true); clearTimeout(tVerde); tVerde = setTimeout(() => verde(false), 2000); }
  } else {
    if(c && !coberto) contar();
    verde(!!c);
    $('luz').style.width = Math.min(100, nivel / 1.5 * 100) + '%';
    $('lim').style.left = Math.min(100, lim / 1.5 * 100) + '%';
    $('pct').textContent = Math.round(nivel * 100) + '%';
  }
  coberto = c;
};
window.sensorMov = function(dif, lim, e){
  if(modo !== 'mov') return;
  const top = Math.max(lim * 2, 1);
  $('luz').style.width = Math.min(100, dif / top * 100) + '%';
  $('luz').style.background = e === 2 ? '#aaa' : '#f5b800';
  $('lim').style.left = Math.min(100, lim / top * 100) + '%';
  $('pct').textContent = e === 2 ? 'parado (ignorado)' : (e === 1 ? 'passando…' : 'calmo');
};
window.sensorPassada = function(){
  if(modo !== 'mov') return;
  contar(); verde(true); clearTimeout(tVerde); tVerde = setTimeout(() => verde(false), 1500);
};
window.semCamera = function(){
  $('dica').textContent = 'O app não tem permissão da câmera. Vá em Ajustes › Sensor › Câmera e ative.';
};

$('m-prox').onclick = () => escolher('prox');
$('m-camera').onclick = () => escolher('camera');
$('m-mov').onclick = () => escolher('mov');
$('sens').oninput = e => { $('vs').textContent = e.target.value; mandar({cmd:'sens', valor:+e.target.value}); };
$('recal').onclick = () => mandar({cmd:'recalibrar'});
$('zero').onclick = () => { n = 0; $('n').textContent = 0; };
document.addEventListener('gesturestart', e => e.preventDefault());
escolher('prox');
</script>
</body></html>
