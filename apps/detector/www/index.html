<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Detector</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#071a44;font-family:-apple-system,system-ui,sans-serif;color:#fff}
#menu{position:fixed;inset:0;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(180deg,#071a44 0%,#0d3a9a 45%,#3f86e8 82%,#cfe6ff 100%);display:flex;flex-direction:column;gap:10px}
.topo{position:relative;text-align:center}
.logo{width:72px;height:72px;border-radius:16px;display:block;margin:0 auto}
.nome{font-size:22px;font-weight:600;letter-spacing:5px;margin-top:4px}
#pw{position:absolute;top:2px;right:2px;width:46px;height:46px;border-radius:50%;background:#3a3f55;border:2px solid #667;display:flex;align-items:center;justify-content:center;transition:background .2s}
#pw.on{background:#e53935;border-color:#ff8a80;box-shadow:0 0 14px rgba(255,60,50,.6)}
#pw svg{width:24px;height:24px}
.pn{background:rgba(5,18,50,.55);border:0.5px solid rgba(160,200,255,.25);border-radius:16px;padding:10px 12px}
.fdpn{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
#trava{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;z-index:2}
#trava.on{background:#e53935}
#trava svg{width:17px;height:17px}
.fdpn.travado .faders{opacity:.35;pointer-events:none}
.faders{padding-right:22px}
.faders{display:flex;gap:4px;flex:1;min-height:0}
.fd{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.vl{font-size:15px;font-weight:600}
.tr{position:relative;width:10px;flex:1;min-height:70px;background:#03102e;border-radius:5px;border:0.5px solid rgba(160,200,255,.3);touch-action:none}
.tr::before{content:'';position:absolute;left:-26px;right:-26px;top:-12px;bottom:-12px}
.lv{position:absolute;bottom:0;left:0;right:0;background:#e53935;border-radius:5px;opacity:.55}
.kn{position:absolute;left:50%;width:46px;height:24px;margin-left:-23px;border-radius:6px;background:#e53935;border:2px solid #ff8a80;transform:translateY(50%)}
.kn::after{content:'';position:absolute;left:8px;right:8px;top:9px;height:2px;background:#fff}
.lbx{font-size:12px;color:#cfe3ff;text-align:center;line-height:1.25}
.cab{display:flex;justify-content:space-between;font-size:12px;color:#cfe3ff}
.vm{display:flex;gap:3px;margin-top:7px}.vm div{flex:1;height:13px;border-radius:2px;background:#0a1a40}
.rw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px;gap:8px}
.rw+.rw{border-top:0.5px solid rgba(160,200,255,.2)}
.sw{width:50px;height:28px;border-radius:7px;background:#2a2f45;position:relative;border:0.5px solid rgba(255,255,255,.25);flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:5px;background:#99a;transition:left .15s}
.sw.on{background:#7a1414}.sw.on::after{left:25px;background:#ff5252}
.dr{display:flex;align-items:center;gap:8px}
.min{display:flex;background:#03102e;border-radius:7px;padding:2px}
.min div{padding:4px 7px;font-size:12px;border-radius:5px;color:#9fb6d8}
.min div.on{background:#e53935;color:#fff}
.min.off{opacity:.35}
#disf{position:fixed;inset:0;background:#000;display:none}
</style></head>
<body>
<div id="menu">
  <div class="topo">
    <img class="logo" src="logo.png" alt="">
    <div class="nome">DETECTOR</div>
    <div id="pw"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg></div>
  </div>

  <div class="pn fdpn" id="fdpn">
    <div id="trava"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path id="arco" d="M8 11V7a4 4 0 0 1 8 0"/></svg></div>
    <div class="faders">
      <div class="fd"><span class="vl" id="v-sens">60</span><div class="tr" data-k="sens"><div class="lv"></div><div class="kn"></div></div><span class="lbx">Sensibi-<br>lidade</span></div>
      <div class="fd"><span class="vl" id="v-adapt">70</span><div class="tr" data-k="adapt"><div class="lv"></div><div class="kn"></div></div><span class="lbx">Sens.<br>adaptativa</span></div>
      <div class="fd"><span class="vl" id="v-forca">100</span><div class="tr" data-k="forca"><div class="lv"></div><div class="kn"></div></div><span class="lbx">Força da<br>vibração</span></div>
    </div>
  </div>

  <div class="pn">
    <div class="cab"><span id="sinal-txt">Sinal ao vivo</span><span id="ut">—</span></div>
    <div class="vm" id="vm"></div>
  </div>

  <div class="pn" style="padding:0 12px">
    <div class="rw"><span>Confirmação dupla</span><div class="sw" data-k="dupla"></div></div>
    <div class="rw"><span>Saída: vibração longa</span><div class="sw" data-k="saidaLonga"></div></div>
    <div class="rw"><span>Disfarce: tela preta</span><div class="sw" data-k="disfarce"></div></div>
    <div class="rw"><span>Apagar no bolso</span><div class="sw" data-k="bolso"></div></div>
    <div class="rw"><div class="dr"><span>Dormir</span>
      <div class="min" id="min"><div data-m="2">2</div><div data-m="5">5</div><div data-m="10">10</div><div data-m="15">15 min</div></div></div>
      <div class="sw" data-k="dormir"></div></div>
  </div>
</div>
<div id="disf"></div>

<script>
const NATIVO = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ima);
function mandar(o){ if(NATIVO) window.webkit.messageHandlers.ima.postMessage(o); }
function barra(esconder){ try{ window.webkit.messageHandlers.barra.postMessage(esconder); }catch(e){} }
try{ window.webkit.messageHandlers.estilo.postMessage('claro'); }catch(e){}

const PADRAO = {sens:60, adapt:70, forca:100, dupla:true, saidaLonga:false, disfarce:true, bolso:true, dormir:true, dormirMin:5, travado:false};
let aj = Object.assign({}, PADRAO);
try{ Object.assign(aj, JSON.parse(localStorage.getItem('detector-ajustes-21')||'{}')); }catch(e){}
function guardar(){ try{ localStorage.setItem('detector-ajustes-21', JSON.stringify(aj)); }catch(e){} }
function ajustesNativo(){ return {sens:aj.sens, adapt:aj.adapt, forca:aj.forca, dupla:aj.dupla, saidaLonga:aj.saidaLonga, dormir:aj.dormir, dormirMin:aj.dormirMin}; }
function avisarAjustes(){ guardar(); mandar(Object.assign({cmd:'ajustes'}, ajustesNativo())); }

let ligado = false;

// faders
const porFader = {};
document.querySelectorAll('.tr').forEach(tr=>{
  const k = tr.dataset.k;
  function por(v, avisar){
    v = Math.max(0, Math.min(100, Math.round(v)));
    aj[k] = v;
    tr.querySelector('.kn').style.bottom = v + '%';
    tr.querySelector('.lv').style.height = v + '%';
    document.getElementById('v-' + k).textContent = v;
    if (avisar) avisarAjustes();
  }
  porFader[k] = por;
  function mexer(e){ const r = tr.getBoundingClientRect(); por((r.bottom - e.clientY) / r.height * 100, true); }
  tr.addEventListener('pointerdown', e=>{ tr.setPointerCapture(e.pointerId); mexer(e); tr.onpointermove = mexer; });
  tr.addEventListener('pointerup', ()=>{ tr.onpointermove = null; });
  tr.addEventListener('pointercancel', ()=>{ tr.onpointermove = null; });
  por(aj[k], false);
});

// trava dos faders: um toque fecha; para abrir, segurar 1 s
const trava = document.getElementById('trava'), fdpn = document.getElementById('fdpn'), arco = document.getElementById('arco');
function pintarTrava(){
  trava.classList.toggle('on', aj.travado);
  fdpn.classList.toggle('travado', aj.travado);
  arco.setAttribute('d', aj.travado ? 'M8 11V7a4 4 0 0 1 8 0v4' : 'M8 11V7a4 4 0 0 1 8 0');
}
let seguraT = null;
trava.addEventListener('pointerdown', e=>{
  e.preventDefault();
  if (!aj.travado) { aj.travado = true; guardar(); pintarTrava(); return; }
  seguraT = setTimeout(()=>{ seguraT = null; aj.travado = false; guardar(); pintarTrava(); }, 1000);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=> trava.addEventListener(ev, ()=>{ if (seguraT) { clearTimeout(seguraT); seguraT = null; } }));
pintarTrava();

// chaves
document.querySelectorAll('.sw').forEach(s=>{
  const k = s.dataset.k;
  s.classList.toggle('on', !!aj[k]);
  s.addEventListener('click', ()=>{
    aj[k] = !aj[k]; s.classList.toggle('on', aj[k]);
    if (k === 'dormir') pintarMin();
    avisarAjustes();
  });
});

// tempo para dormir
const minEl = document.getElementById('min');
function pintarMin(){
  minEl.classList.toggle('off', !aj.dormir);
  [...minEl.children].forEach(d=> d.classList.toggle('on', +d.dataset.m === aj.dormirMin));
}
[...minEl.children].forEach(d=> d.addEventListener('click', ()=>{ aj.dormirMin = +d.dataset.m; pintarMin(); avisarAjustes(); }));
pintarMin();

// liga / desliga: liga, aprende a sala, vibra vum vum vum e entra no disfarce
const pw = document.getElementById('pw');
pw.addEventListener('click', ()=>{
  ligado = !ligado;
  pw.classList.toggle('on', ligado);
  if (ligado) {
    mandar(Object.assign({cmd:'ligar'}, ajustesNativo()));
    if (!NATIVO) simular();
    if (aj.disfarce) entrarDisfarce();
  } else {
    mandar({cmd:'desligar'});
    imaSinal(0, 10, 0);
  }
});

// disfarce: tela toda preta; dois toques na parte de cima voltam ao menu (o detector continua ligado)
const disf = document.getElementById('disf');
let ultimoToque = 0;
function entrarDisfarce(){
  disf.style.display = 'block';
  barra(true);
  if (aj.bolso) mandar({cmd:'bolso', ligar:true});
}
function sairDisfarce(){
  disf.style.display = 'none';
  barra(false);
  mandar({cmd:'bolso', ligar:false});
}
disf.addEventListener('touchstart', e=>{
  e.preventDefault();
  const y = e.touches[0].clientY;
  if (y > window.innerHeight * 0.3) { ultimoToque = 0; return; }
  const agora = Date.now();
  if (agora - ultimoToque < 400) { ultimoToque = 0; sairDisfarce(); }
  else ultimoToque = agora;
}, {passive:false});

// medidor
const vm = document.getElementById('vm');
const LEDS = 16;
for (let i = 0; i < LEDS; i++) vm.appendChild(document.createElement('div'));
function led(v){ return v <= 1 ? 0 : Math.min(LEDS, Math.log(v) / Math.log(150) * LEDS); }   // 1 µT a 150 µT
const TEXTOS = {0:'Sinal ao vivo', 1:'Aprendendo a sala…', 2:'Sinal ao vivo', 3:'Ímã perto!', 4:'Dormindo · encoste o ímã para acordar',
  5:'Acordou · afaste o ímã'};
window.imaSinal = function(v, lim, est){
  const n = Math.round(led(v)), lt = Math.max(1, Math.round(led(lim)));
  [...vm.children].forEach((d, i)=>{
    const marca = i === lt - 1;
    d.style.background = i < n ? (i >= lt ? '#ff3b30' : '#7fb8ff') : (marca ? '#5a2030' : '#0a1a40');
  });
  document.getElementById('ut').textContent = (est === 0 || est === 1) ? '—' : Math.round(v) + ' µT';
  document.getElementById('sinal-txt').textContent = TEXTOS[est] || 'Sinal ao vivo';
};
imaSinal(0, 10, 0);

// fora do iPhone (só para ver a tela): sinal de mentira
let simulando = false;
function simular(){
  if (simulando) return; simulando = true;
  let t = 0;
  setInterval(()=>{
    if (!ligado) return;
    t++;
    const lim = 80 * Math.pow(0.04, aj.sens / 100);
    if (t < 14) return imaSinal(0, lim, 1);
    const v = (t % 40 > 30) ? 30 + Math.random() * 60 : 1 + Math.random() * 3;
    imaSinal(v, lim, v > lim ? 3 : 2);
  }, 150);
}
</script>
</body></html>
