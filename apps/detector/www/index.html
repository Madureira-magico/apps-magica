<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Detector</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#071a44;font-family:-apple-system,system-ui,sans-serif;color:#fff}
#menu{position:fixed;inset:0;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 16px);
  background:linear-gradient(180deg,#071a44 0%,#0d3a9a 45%,#3f86e8 80%,#cfe6ff 100%);display:flex;flex-direction:column;gap:12px}
.topo{display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.logo{width:76px;height:76px;border-radius:18px}
#pw{width:76px;height:76px;border-radius:50%;background:#3a3f55;border:3px solid #667;display:flex;align-items:center;justify-content:center;transition:background .2s}
#pw.on{background:#e53935;border-color:#ff8a80;box-shadow:0 0 18px rgba(255,60,50,.6)}
#pw svg{width:36px;height:36px}
.pn{background:rgba(5,18,50,.55);border:0.5px solid rgba(160,200,255,.25);border-radius:16px;padding:12px}
.faders{display:flex;gap:4px;flex:1;min-height:0}
.fd{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.vl{font-size:15px;font-weight:600}
.tr{position:relative;width:10px;flex:1;min-height:90px;background:#03102e;border-radius:5px;border:0.5px solid rgba(160,200,255,.3);touch-action:none}
.tr::before{content:'';position:absolute;left:-26px;right:-26px;top:-12px;bottom:-12px}
.lv{position:absolute;bottom:0;left:0;right:0;background:#e53935;border-radius:5px;opacity:.55}
.kn{position:absolute;left:50%;width:46px;height:24px;margin-left:-23px;border-radius:6px;background:#e53935;border:2px solid #ff8a80;transform:translateY(50%)}
.kn::after{content:'';position:absolute;left:8px;right:8px;top:9px;height:2px;background:#fff}
.lbx{font-size:12px;color:#cfe3ff;text-align:center;line-height:1.25}
.cab{display:flex;justify-content:space-between;font-size:12px;color:#cfe3ff}
.vm{display:flex;gap:3px;margin-top:8px}.vm div{flex:1;height:14px;border-radius:2px;background:#0a1a40}
.rw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:15px}
.rw+.rw{border-top:0.5px solid rgba(160,200,255,.2)}
.sw{width:50px;height:28px;border-radius:7px;background:#2a2f45;position:relative;border:0.5px solid rgba(255,255,255,.25);flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:5px;background:#99a;transition:left .15s}
.sw.on{background:#7a1414}.sw.on::after{left:25px;background:#ff5252}
.bts{display:flex;gap:8px}
.bt{flex:1;text-align:center;padding:12px 0;border-radius:12px;font-size:14px;background:rgba(255,255,255,.85);color:#0d3a9a;font-weight:500}
.bt:active{opacity:.7}
#disf{position:fixed;inset:0;background:#000;display:none}
</style></head>
<body>
<div id="menu">
  <div class="topo">
    <img class="logo" src="logo.png" alt="">
    <div id="pw"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg></div>
  </div>

  <div class="pn faders">
    <div class="fd"><span class="vl" id="v-sens">60</span><div class="tr" data-k="sens"><div class="lv"></div><div class="kn"></div></div><span class="lbx">Sensibi-<br>lidade</span></div>
    <div class="fd"><span class="vl" id="v-forca">70</span><div class="tr" data-k="forca"><div class="lv"></div><div class="kn"></div></div><span class="lbx">Força da<br>vibração</span></div>
    <div class="fd"><span class="vl" id="v-tempo">40</span><div class="tr" data-k="tempo"><div class="lv"></div><div class="kn"></div></div><span class="lbx">Tempo da<br>vibração</span></div>
  </div>

  <div class="pn">
    <div class="cab"><span id="sinal-txt">Sinal ao vivo</span><span id="ut">—</span></div>
    <div class="vm" id="vm"></div>
  </div>

  <div class="pn" style="padding:2px 12px">
    <div class="rw"><span>Confirmação dupla</span><div class="sw" data-k="dupla"></div></div>
    <div class="rw"><span>Disfarce: tela preta</span><div class="sw" data-k="disfarce"></div></div>
    <div class="rw"><span>Apagar no bolso</span><div class="sw" data-k="bolso"></div></div>
  </div>

  <div class="bts">
    <div class="bt" id="testar">Testar vibração</div>
    <div class="bt" id="recal">Recalibrar</div>
  </div>
</div>
<div id="disf"></div>

<script>
const NATIVO = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ima);
function mandar(o){ if(NATIVO) window.webkit.messageHandlers.ima.postMessage(o); }
function barra(esconder){ try{ window.webkit.messageHandlers.barra.postMessage(esconder); }catch(e){} }
try{ window.webkit.messageHandlers.estilo.postMessage('claro'); }catch(e){}

const PADRAO = {sens:60, forca:70, tempo:40, dupla:true, disfarce:true, bolso:true};
let aj = Object.assign({}, PADRAO);
try{ Object.assign(aj, JSON.parse(localStorage.getItem('detector-ajustes')||'{}')); }catch(e){}
function guardar(){ try{ localStorage.setItem('detector-ajustes', JSON.stringify(aj)); }catch(e){} }
function ajustesNativo(){ return {sens:aj.sens, forca:aj.forca, tempo:aj.tempo, dupla:aj.dupla}; }

let ligado = false, estado = 0, limite = 10;

// faders
document.querySelectorAll('.tr').forEach(tr=>{
  const k = tr.dataset.k;
  function por(v, avisar){
    v = Math.max(0, Math.min(100, Math.round(v)));
    aj[k] = v;
    tr.querySelector('.kn').style.bottom = v + '%';
    tr.querySelector('.lv').style.height = v + '%';
    document.getElementById('v-' + k).textContent = v;
    if (avisar) { guardar(); mandar(Object.assign({cmd:'ajustes'}, ajustesNativo())); }
  }
  function mexer(e){ const r = tr.getBoundingClientRect(); por((r.bottom - e.clientY) / r.height * 100, true); }
  tr.addEventListener('pointerdown', e=>{ tr.setPointerCapture(e.pointerId); mexer(e); tr.onpointermove = mexer; });
  tr.addEventListener('pointerup', ()=>{ tr.onpointermove = null; });
  tr.addEventListener('pointercancel', ()=>{ tr.onpointermove = null; });
  por(aj[k], false);
});

// chaves
document.querySelectorAll('.sw').forEach(s=>{
  const k = s.dataset.k;
  s.classList.toggle('on', !!aj[k]);
  s.addEventListener('click', ()=>{
    aj[k] = !aj[k]; s.classList.toggle('on', aj[k]); guardar();
    if (k === 'dupla') mandar(Object.assign({cmd:'ajustes'}, ajustesNativo()));
  });
});

// liga / desliga: liga, aprende a sala e entra no disfarce
const pw = document.getElementById('pw');
pw.addEventListener('click', ()=>{
  ligado = !ligado;
  pw.classList.toggle('on', ligado);
  if (ligado) {
    mandar(Object.assign({cmd:'ligar'}, ajustesNativo()));
    if (!NATIVO) simular();
    if (aj.disfarce) entrarDisfarce();
  } else {
    mandar({cmd:'desligar'});
    imaSinal(0, limite, 0);
  }
});

document.getElementById('testar').addEventListener('click', ()=> mandar({cmd:'vibrar'}));
document.getElementById('recal').addEventListener('click', ()=>{ if (ligado) mandar({cmd:'recalibrar'}); });

// disfarce: tela toda preta; dois toques na parte de cima voltam ao menu (o detector continua ligado)
const disf = document.getElementById('disf');
let ultimoToque = 0;
function entrarDisfarce(){
  disf.style.display = 'block';
  barra(true);
  if (aj.bolso) mandar({cmd:'bolso', ligar:true});
}
function sairDisfarce(){
  disf.style.display = 'none';
  barra(false);
  mandar({cmd:'bolso', ligar:false});
}
disf.addEventListener('touchstart', e=>{
  e.preventDefault();
  const y = e.touches[0].clientY;
  if (y > window.innerHeight * 0.3) { ultimoToque = 0; return; }
  const agora = Date.now();
  if (agora - ultimoToque < 400) { ultimoToque = 0; sairDisfarce(); }
  else ultimoToque = agora;
}, {passive:false});

// medidor
const vm = document.getElementById('vm');
const LEDS = 16;
for (let i = 0; i < LEDS; i++) vm.appendChild(document.createElement('div'));
function led(v){ return v <= 1 ? 0 : Math.min(LEDS, Math.log(v) / Math.log(150) * LEDS); }   // 1 µT a 150 µT
window.imaSinal = function(v, lim, est){
  estado = est; limite = lim;
  const n = Math.round(led(v)), lt = Math.max(1, Math.round(led(lim)));
  [...vm.children].forEach((d, i)=>{
    const marca = i === lt - 1;
    d.style.background = i < n ? (i >= lt ? '#ff3b30' : '#7fb8ff') : (marca ? '#5a2030' : '#0a1a40');
  });
  document.getElementById('ut').textContent = est === 0 ? '—' : (est === 1 ? '…' : Math.round(v) + ' µT');
  document.getElementById('sinal-txt').textContent = est === 1 ? 'Aprendendo a sala…' : 'Sinal ao vivo';
};
imaSinal(0, 10, 0);

// fora do iPhone (só para ver a tela): sinal de mentira
let simulando = false;
function simular(){
  if (simulando) return; simulando = true;
  let t = 0;
  setInterval(()=>{
    if (!ligado) return;
    t++;
    const lim = 80 * Math.pow(0.04, aj.sens / 100);
    if (t < 14) return imaSinal(0, lim, 1);
    const v = (t % 40 > 30) ? 30 + Math.random() * 60 : 1 + Math.random() * 3;
    imaSinal(v, lim, v > lim ? 3 : 2);
  }, 150);
}
</script>
</body></html>
